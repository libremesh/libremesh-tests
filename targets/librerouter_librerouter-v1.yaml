# LibreRouter v1 (ath79) - single-image variant
#
# This target boots from a self-contained `*-initramfs-kernel.bin` image
# (kernel with LibreMesh CPIO embedded via CONFIG_INITRAMFS_SOURCE). It is
# the default for:
#   - Mesh tests (mesh_boot_node.py sets only LG_IMAGE per node).
#   - Local single-node runs with a LibreMesh release image.
#   - openwrt-tests healthcheck (labnet.yaml maps here).
#
# For pi-lime-packages CI (ImageBuilder cannot build initramfs kernels;
# ships kernel.bin + rootfs.uimage separately) use the dual-TFTP variant:
#   targets/librerouter_librerouter-v1-dual-tftp.yaml
targets:
  main:
    features:
      - wan_port
      - wifi
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
    drivers:
      - PDUDaemonDriver: {}
      - TFTPProviderDriver: {}
      - SerialDriver:
          txdelay: 0.01
      - UBootDriver:
          login_timeout: 30
          # A single newline aborts autoboot within the 2s bootdelay window;
          # tftpstrategy._spam_uboot_interrupt blasts these for ~12s to be
          # robust against serial-console jitter on the ath79 U-Boot 1.1.x.
          interrupt: "\n"
          autoboot: "Hit any key to stop autoboot"
          prompt: "ath>"
          init_commands:
            - "tftp 0x82000000"
          boot_command: "bootm 0x82000000"
      - ShellDriver:
          # Accept any LibreMesh/OpenWrt hostname, not only the default
          # LiMe-<MAC6> pattern. Images built with a fixed hostname in
          # /etc/config/lime (e.g. `margarita` on some LibreRouter batches)
          # would otherwise never match and _await_login() timed out at 180s.
          prompt: "(?:\\x1b\\][^\\x07]*\\x07)?(?:\\x1b\\[[\\d;]*m)*root@[\\w()-]+:[^ ]*[#$] "
          login_prompt: Please press Enter to activate this console.
          await_login_timeout: 15
          login_timeout: 180
          post_login_settle_time: 5
          username: root
      - UBootTFTPStrategy: {}
      - SSHDriver:
          connection_timeout: 120.0
          explicit_scp_mode: True

images:
  root: !template $LG_IMAGE

imports:
  - ../strategies/tftpstrategy.py
