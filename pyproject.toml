[project]
name = "tests"
version = "0.1.0"
description = "LibreMesh-focused pytest suite for labgrid HIL (FCEFyN and compatible labs)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "labgrid>=25.0",
    "pytest>=8.4.1",
    "pytest-check>=2.5.3",
    "pytest-harvest>=1.10.5",
]

[tool.uv.sources]
labgrid = { git = "https://github.com/aparcar/labgrid.git", branch = "aparcar/staging" }

[dependency-groups]
# Ruff is capped below 0.16: newer releases enable additional default lint
# rules (RUF059, PIE810, ...) that flag pre-existing patterns in the
# codebase, breaking CI on every new PR without any related code change.
# Bump this cap deliberately when we opt into the new rules.
dev = ["isort>=6.0.1", "ruff>=0.12.0,<0.16"]

[tool.isort]
profile = "black"
line_length = 88
